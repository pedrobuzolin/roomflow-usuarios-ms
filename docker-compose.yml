services:
  usuarios:
    build: .
    image: roomflow-usuarios
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/roomflow_usuarios
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: roomflow_usuarios
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d roomflow_usuarios"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - roomflow_usuarios-data:/var/lib/postgresql/data

volumes:
  roomflow_usuarios-data: